<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>LED Brightness Control</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body
        class="bg-gradient-to-br from-blue-100 to-indigo-200 min-h-screen flex items-center justify-center"
    >
        <div
            class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md flex flex-col items-center"
        >
            <h1 class="text-2xl font-bold mb-6 text-indigo-700">
                LED Brightness Control
            </h1>
            <label
                for="brightness"
                class="block text-lg font-medium text-gray-700 mb-2"
            >
                LED Brightness
            </label>
            <input
                type="range"
                name="brightness"
                id="brightness"
                min="0"
                max="255"
                value="0"
                class="w-full accent-indigo-600 mb-4"
            />
            <span
                id="brightnessValue"
                class="text-indigo-600 font-semibold text-xl"
                >0</span
            >
        </div>
        <script>
            let HOST = "ws://localhost:3000";
            const socket = new WebSocket(HOST);

            socket.addEventListener("open", () => {
                console.log("Connected to WebSocket server");
            });

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (typeof data.brightness === "number") {
                    brightnessInput.value = data.brightness;
                    brightnessValue.textContent = data.brightness;
                }
            }

            const brightnessInput =
                document.getElementById("brightness");
            const brightnessValue =
                document.getElementById("brightnessValue");

            brightnessInput.addEventListener("input", (e) => {
                const value = e.target.value;
                brightnessValue.textContent = value;
                if (socket.readyState === WebSocket.OPEN) {
                    socket.send(
                        JSON.stringify({ brightness: Number(value) })
                    );
                }
            });
        </script>
    </body>
</html>
